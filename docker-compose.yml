services:
  minerva-amundsen-frontend:
    image: amundsendev/amundsen-frontend:latest
    container_name: ${PROJECT_NAME}_amundsen_frontend
    ports:
      - "${AMUNDSEN_FRONTEND_PORT}:5000"
    environment:
      - SEARCHSERVICE_BASE=http://minerva-amundsen-search:5001
      - METADATASERVICE_BASE=http://minerva-amundsen-metadata:5002
    depends_on:
      - minerva-amundsen-search
      - minerva-amundsen-metadata
    networks:
      - ${PROJECT_NAME}_net

  minerva-amundsen-metadata:
    image: amundsendev/amundsen-metadata:latest
    container_name: ${PROJECT_NAME}_amundsen_metadata
    ports:
      - "${AMUNDSEN_METADATA_PORT}:5002"
    environment:
      - PROXY_HOST=bolt://minerva-amundsen-neo4j
    depends_on:
      - minerva-amundsen-neo4j
    networks:
      - ${PROJECT_NAME}_net

  minerva-elasticsearch:
      image: elasticsearch:7.10.1
      container_name: ${PROJECT_NAME}_elasticsearch
      ports:
          - 9200:9200
      volumes:
        - .:/usr/share/elasticsearch/data
      networks:
        - ${PROJECT_NAME}_net
      ulimits:
        nofile:
          soft: 65536
          hard: 65536
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=false
        - ES_JAVA_OPTS=-Xms2g -Xmx2g
        - cluster.routing.allocation.disk.watermark.low=70%
        - cluster.routing.allocation.disk.watermark.high=85%
        - cluster.routing.allocation.disk.watermark.flood_stage=95%

  minerva-amundsen-search:
    image: amundsendev/amundsen-search:latest
    container_name: ${PROJECT_NAME}_amundsen_search
    ports:
      - "${AMUNDSEN_SEARCH_PORT}:5001"
    environment:
      - PROXY_ENDPOINT=minerva-elasticsearch
    networks:
      - ${PROJECT_NAME}_net
    depends_on:
      - minerva-elasticsearch

  minerva-amundsen-neo4j:
    image: neo4j:3.5
    platform: linux/amd64  
    container_name: ${PROJECT_NAME}_amundsen_neo4j
    ports:
      - "${AMUNDSEN_NEO4J_HTTP_PORT}:7474"
      - "${AMUNDSEN_NEO4J_BOLT_PORT}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    volumes:
      - ${PROJECT_NAME}_neo4j_data:/data
    networks:
      - ${PROJECT_NAME}_net

  minerva_postgres:
    image: postgres:13
    container_name: ${PROJECT_NAME}_postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - ${PROJECT_NAME}_postgres_data:/var/lib/postgresql/data
    networks:
      - ${PROJECT_NAME}_net 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 8s
      retries: 5 

  minerva-dagster-webserver:
    platform: linux/amd64
    build:
      context: ./dagster
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}_dagster_webserver
    ports:
      - '3000:3000'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: ${PROJECT_NAME}_postgres
      SOURCE_MSSQL_USER: ${SOURCE_MSSQL_USER}
      SOURCE_MSSQL_PASSWORD: ${SOURCE_MSSQL_PASSWORD}
      SOURCE_MSSQL_DB: ${SOURCE_MSSQL_DB}
      SOURCE_MSSQL_PORT: ${SOURCE_MSSQL_PORT}
      SOURCE_MSSQL_HOST: mssql_db
    volumes:
      - ./dbt:/dbt
    networks:
      - ${PROJECT_NAME}_net
      - multi-container-project_default
    #depends_on:
      #minerva_postgres:
       # condition: service_healthy

  minerva-dagster-daemon:
    platform: linux/amd64
    build:
      context: ./dagster
      dockerfile: Dockerfile
    command: "dagster-daemon run"
    container_name: ${PROJECT_NAME}_dagster_daemon
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      POSTGRES_HOST: ${PROJECT_NAME}_postgres
      DAGSTER_CODE_SERVER_HEARTBEAT_TIMEOUT: 60
      SOURCE_MSSQL_USER: ${SOURCE_MSSQL_USER}
      SOURCE_MSSQL_PASSWORD: ${SOURCE_MSSQL_PASSWORD}
      SOURCE_MSSQL_DB: ${SOURCE_MSSQL_DB}
      SOURCE_MSSQL_PORT: ${SOURCE_MSSQL_PORT}
      SOURCE_MSSQL_HOST: mssql_db
    volumes: 
      - minerva_postgres_data:/var/lib/postgresql/data
      - ./dagster/jobs:/jobs
      - ./dbt:/dbt
    networks:
      - ${PROJECT_NAME}_net
      - multi-container-project_default
    #depends_on:
      #minerva_postgres:
      #  condition: service_healthy

  minerva-dbt:
    platform: linux/amd64
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    container_name: ${PROJECT_NAME}_dbt
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: /usr/app
    depends_on:
      - ${PROJECT_NAME}_postgres

  minerva-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ${PROJECT_NAME}_clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-default}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse123}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ${PROJECT_NAME}_clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - ${PROJECT_NAME}_net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  minerva_neo4j_data:
  minerva_postgres_data:
  minerva_clickhouse_data:

networks:
  minerva_net:
    driver: bridge
  multi-container-project_default:
    external: true

